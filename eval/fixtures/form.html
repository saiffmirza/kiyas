<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="_loader.js"></script>
<style>
  body { margin: 0; padding: 40px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; background: #fff; }
  form { width: 360px; }
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 6px; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  button { width: 100%; padding: 12px; background: #111827; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <form>
    <div class="field">
      <label>Email address</label>
      <input type="email" placeholder="you@company.com">
      <div class="hint">We'll never share your email.</div>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button type="button">Sign in</button>
  </form>
</body>
</html>
