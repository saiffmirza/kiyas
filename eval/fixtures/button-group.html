<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="_loader.js"></script>
<style>
  body { margin: 0; padding: 40px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; background: #fff; }
  .group { display: flex; gap: 12px; }
  .btn { padding: 10px 24px; border: none; font-size: 15px; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; border-radius: 8px; font-weight: 600; }
  .btn-secondary { background: #fff; color: #2563eb; border: 1.5px solid #2563eb; border-radius: 8px; font-weight: 600; }
  .btn-ghost { background: transparent; color: #6b7280; border-radius: 8px; font-weight: 500; }
</style>
</head>
<body>
  <div class="group">
    <button class="btn btn-primary">Save changes</button>
    <button class="btn btn-secondary">Preview</button>
    <button class="btn btn-ghost">Cancel</button>
  </div>
</body>
</html>
