name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # npm trusted publishing + MCP registry OIDC
  contents: write # GitHub release creation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "
            const { readFileSync } = require('node:fs');
            const tag = process.argv[1];
            const pkg = JSON.parse(readFileSync('package.json', 'utf-8')).version;
            const server = JSON.parse(readFileSync('server.json', 'utf-8'));
            const versionTs = readFileSync('src/version.ts', 'utf-8').match(/\"([^\"]+)\"/)[1];
            const all = { 'package.json': pkg, 'server.json': server.version, 'server.json packages[0]': server.packages[0].version, 'src/version.ts': versionTs };
            const bad = Object.entries(all).filter(([, v]) => v !== tag);
            if (bad.length) {
              console.error('Version mismatch with tag v' + tag + ':', Object.fromEntries(bad));
              process.exit(1);
            }
            console.log('All versions match v' + tag);
          " "$TAG"

      - run: npm run build

      - run: npm test

      - name: Publish to npm
        run: npm publish

      - name: Publish to MCP Registry
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -o 'https://[^"]*mcp-publisher[^"]*linux_amd64.tar.gz' | head -1)" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
