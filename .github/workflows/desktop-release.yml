name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # GitHub release creation

jobs:
  release:
    # macOS 26 image ships Xcode 26, required by actool to compile the
    # Liquid Glass icon bundle (build/kiyas.icon → Assets.car)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Releases are cut from main only."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "apps/desktop/package.json is $PKG but tag is desktop-v$TAG"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build -w @kiyas/desktop

      - name: Package .dmg and .zip
        working-directory: apps/desktop
        env:
          # No certificate in CI: the afterPack hook ad-hoc signs the bundle
          # (valid seal -> Gatekeeper's bypassable "could not verify" dialog
          # instead of the dead-end "damaged" one). To sign for real, drop
          # this and add CSC_LINK / CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac

      - name: Verify the packaged app's signature seals
        run: |
          codesign --verify --deep --strict --verbose=2 apps/desktop/dist/mac-arm64/Kiyas.app

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --list 'desktop-v*' --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -1 || true)
          {
            echo "Un-notarized build. On first launch macOS says it \"could not verify\" the app:"
            echo "close that dialog, then open **System Settings → Privacy & Security** and click **Open Anyway**."
            echo ""
            echo "Terminal alternative (skips the dialog entirely):"
            echo '`xattr -dr com.apple.quarantine /Applications/Kiyas.app`'
            echo ""
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}$GITHUB_REF_NAME -- apps/desktop packages/core
            [ -n "$PREV" ] && echo "" && echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Kiyas Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes-file /tmp/notes.md \
            apps/desktop/dist/*.dmg apps/desktop/dist/*.zip
