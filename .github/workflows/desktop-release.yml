name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # GitHub release creation

jobs:
  release:
    # macOS 26 image ships Xcode 26, required by actool to compile the
    # Liquid Glass icon bundle (build/kiyas.icon → Assets.car)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Releases are cut from main only."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "apps/desktop/package.json is $PKG but tag is desktop-v$TAG"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build -w @kiyas/desktop

      - name: Package .dmg and .zip
        working-directory: apps/desktop
        env:
          # Ad-hoc signing: no certificate in CI (yet). To sign for real,
          # remove this and add CSC_LINK / CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --list 'desktop-v*' --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -1 || true)
          {
            echo "Un-notarized preview build — on first launch, right-click → Open, or run:"
            echo '`xattr -dr com.apple.quarantine /Applications/Kiyas.app`'
            echo ""
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}$GITHUB_REF_NAME -- apps/desktop packages/core
            [ -n "$PREV" ] && echo "" && echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Kiyas Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes-file /tmp/notes.md \
            apps/desktop/dist/*.dmg apps/desktop/dist/*.zip
